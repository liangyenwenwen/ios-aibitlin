<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.5, maximum-scale=2.0, user-scalable=no" />
        <meta content="yes" name="apple-mobile-web-app-capable" />
        <meta content="black" name="apple-mobile-web-app-status-bar-style" />
        <meta content="telephone=no" name="format-detection" />
        <title>网络异常</title>
        <style type="text/css">
        .header{height:64px;  box-shadow:0px 0px 0px #ccc; text-align:center;position: fixed;z-index: 10;width: 100%;left: 0;right: 0;width: 100%;position: fixed;z-index: 1000;top: -1px;padding-top: 1px;}
        .header .go_left{position:absolute; left:15px; top:23px;text-align: left;}
        .header .go_left img{width:60%;}
        .header .go_right{position:absolute; right:8px; top:23px;}
        .header .go_search{position:absolute; right:8px; top:18px;}
        .header .go_right img{width:70%; }
        </style>
        <script>
    window.onerror = function(err) {
        log('window.onerror: ' + err)
    }

    function setupWKWebViewJavascriptBridge(callback) {
        if (window.WKWebViewJavascriptBridge) { return callback(WKWebViewJavascriptBridge); }
        if (window.WKWVJBCallbacks) { return window.WKWVJBCallbacks.push(callback); }
        window.WKWVJBCallbacks = [callback];
        window.webkit.messageHandlers.iOS_Native_InjectJavascript.postMessage(null)
    }

    setupWKWebViewJavascriptBridge(function(bridge) {
        var uniqueId = 1
        function log(message, data, type) {
            var log = document.getElementById('log')
            var el = document.createElement('div')
            el.className = type == 'native' ? 'logLine_Native' : 'logLine_JS'
            el.innerHTML = uniqueId++ + '. ' + message + ':<br/>' + JSON.stringify(data)
            if (log.children.length) { log.insertBefore(el, log.children[0]) }
            else { log.appendChild(el) }
        }

        bridge.registerHandler('testJavascriptHandler', function(data, responseCallback) {
            log('iOS called testJavascriptHandler with', data, 'native')
            var responseData = { 'Javascript Says':'Right back atcha!' }
            log('JS responding with', responseData, 'native')
            responseCallback(responseData)
        })
        var callbackButton = document.querySelector('.refreshBtn')
        callbackButton.onclick = function(e) {
            bridge.callHandler('refreshWebView', {}, function(response) {
            })
        }
    })
        </script>
    </head>
    <body >
        <div class="header">
        </div>
       <div style="text-align: center;margin-top: 60%;">
            <img  class ='refreshBtn' src="webview_refresh.png";><br><br>
           <span style="  font-family: Hiragino Sans GB,w61;font-size: 18px;">网络不给力，点击重新加载</span>
       </div>
       

    </body>
</html>
